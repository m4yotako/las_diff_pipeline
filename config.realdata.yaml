# これは能登実データ用の config.yaml のバックアップです。
# もし config.yaml をうっかり `cp config.example.yaml config.yaml` などで
# 上書きしてしまった場合は、次のコマンドで復元できます:
#   cp config.realdata.yaml config.yaml   (PowerShellなら Copy-Item config.realdata.yaml config.yaml)

## ─────────────────────────────────────────────
## 入出力
## ─────────────────────────────────────────────
io:
  pre_las: "D:/notowest14/07FD2032.las"           # 被災前の点群
  post_las: "D:/ground_data_07fd1_2025/07fd203_grd.las"   # 被災後の点群（地盤フィルタ済み）
  output_dir: "outputs/realdata"

## ─────────────────────────────────────────────
## 座標系
## ─────────────────────────────────────────────
crs:
  input_epsg: 6675                            # 能登西部14系（JGD2011 平面直角7系）
  output_epsg: 4326
  work_epsg: 6675

## ─────────────────────────────────────────────
## 前処理
## ─────────────────────────────────────────────
preprocess:
  sor:
    enabled: true
    nb_neighbors: 16
    std_ratio: 2.0
  voxel_size: 0.25
  ground_filter:
    enabled: false
    cloth_resolution: 1.0
    rigidness: 2
  bbox: null

## ─────────────────────────────────────────────
## 鉛直基準（Z）ズレ補正
## ─────────────────────────────────────────────
# notowest14（PRE）は楕円体高、ground_data_07fd1_2025（POST）は標高で作成されている
# ことがドキュメントから判明済み（能登地域のジオイド高〜36m相当のズレを確認済み）。
vertical_alignment:
  enabled: true
  mode: "auto"
  warn_threshold_m: 1.0
  max_xy_dist: 1.0

## ─────────────────────────────────────────────
## 位置合わせ（ICP）
## ─────────────────────────────────────────────
registration:
  enabled: true
  stable_mask: null
  max_iterations: 50
  threshold: 0.5

## ─────────────────────────────────────────────
## 差分計算
## ─────────────────────────────────────────────
difference:
  method: "dsm"                               # "m3c2" は未実装のため "dsm" を使用
  m3c2:
    normal_scale: 2.0
    projection_scale: 1.0
    max_depth: 10.0
  dsm:
    resolution: 0.5
    method: "max"

## ─────────────────────────────────────────────
## スコアリング
## ─────────────────────────────────────────────
scoring:
  thresholds: [0.3, 1.0, 3.0]
  use_significance: true
  building_rules:
    loss_ratio_collapse: 0.6

## ─────────────────────────────────────────────
## 集約
## ─────────────────────────────────────────────
aggregation:
  unit: "grid"
  grid:
    cell_size: 5.0
    min_points: 10
  building:
    source: "osm"
    file: null
    bbox: null
    buffer: 0.5
