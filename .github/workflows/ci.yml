name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CLAUDE.md の「合成データで動作確認」をそのままCIで再現する。
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # geopandas/rasterio/fiona 用。Linux x86_64 は基本マニーリナックスホイールが
      # 使えるが、gdal-config が要る場合に備えて念のためインストールしておく。
      - name: Install system deps (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate synthetic LAS data
        run: python examples/generate_synthetic.py

      - name: Run full pipeline (CLI, synthetic data)
        run: python main.py --config examples/config_synthetic.yaml -v

      - name: Verify output GeoJSON
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          p = Path("examples/outputs/synthetic/damage_score.geojson")
          if not p.exists():
              sys.exit(f"missing output: {p}")
          gj = json.loads(p.read_text())
          feats = gj.get("features", [])
          if not feats:
              sys.exit("no features in output GeoJSON")
          print(f"OK: {len(feats)} features")
          PY

  # api/app.py + api/worker_tasks.py + docker-compose.yml の worker コマンドを
  # 実際に redis 経由で動かし、ジョブ投入 -> 完了までの疎通を確認する。
  web-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      JOBS_BASE: /tmp/jobs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system deps (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate synthetic LAS data
        run: python examples/generate_synthetic.py

      - name: Start API server
        run: |
          mkdir -p "$JOBS_BASE"
          nohup uvicorn api.app:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          echo $! > api.pid

      # docker-compose.yml の worker コマンド（`rq worker ...`）と同一のコマンドで起動する。
      # `python -m rq worker` に戻る回帰が起きたらここで検知する。
      - name: Start RQ worker
        run: |
          nohup rq worker --url "$REDIS_URL" --with-scheduler > worker.log 2>&1 &
          echo $! > worker.pid

      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health | grep -q '"redis":"ok"'; then
              echo "API healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"
          cat api.log
          exit 1

      - name: Confirm worker process is alive
        run: |
          sleep 2
          if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
            echo "worker process died on startup — check the rq invocation in docker-compose.yml"
            cat worker.log
            exit 1
          fi
          echo "worker alive"

      # pre 側は2ファイル（タイル分割データ）を送り、複数ファイルアップロードの経路も確認する。
      - name: Submit job (multi-file pre + single post)
        run: |
          JOB_ID=$(curl -sf -X POST http://localhost:8000/jobs \
            -F "pre=@examples/data/pre_synthetic.las;filename=tile0.las" \
            -F "pre=@examples/data/pre_synthetic.las;filename=tile1.las" \
            -F "post=@examples/data/post_synthetic.las" \
            -F 'config={"crs":{"input_epsg":6677,"output_epsg":4326,"work_epsg":6677},"difference":{"method":"dsm"},"scoring":{"use_significance":false}}' \
            | python -c "import sys, json; print(json.load(sys.stdin)['job_id'])")
          echo "job id: $JOB_ID"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Poll job until finished
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sf "http://localhost:8000/jobs/$JOB_ID" | python -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "status=$STATUS"
            if [ "$STATUS" = "finished" ]; then
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              curl -sf "http://localhost:8000/jobs/$JOB_ID"
              cat worker.log
              exit 1
            fi
            sleep 3
          done
          echo "timed out waiting for job"
          cat worker.log
          exit 1

      - name: Fetch and validate result
        run: |
          curl -sf "http://localhost:8000/jobs/$JOB_ID/result" -o result.geojson
          python -c "import json; d = json.load(open('result.geojson')); assert d['features']; print(len(d['features']), 'features OK')"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "--- api.log ---"; cat api.log || true
          echo "--- worker.log ---"; cat worker.log || true
